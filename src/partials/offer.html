<!-- offer.html -->
<section class="offer" id="offer">
  <div class="container offer__container">
    <h1 class="offer__title h2-text">
      Behind each of our cups hides an
      <span class="offer__title-accent accent-text">amazing surprise</span>
    </h1>

    <div class="offer__tabs">
      <button
        class="tab-item tab-item--active"
        type="button"
        data-category="coffee"
      >
        <span class="tab-item__icon" aria-hidden="true"
          ><img class="tab-item__img" src="images/coffee-icon.png" alt=""
        /></span>
        <span class="tab-item__text link-btn-text">Coffee</span>
      </button>

      <button class="tab-item" type="button" data-category="tea">
        <span class="tab-item__icon" aria-hidden="true"
          ><img class="tab-item__img" src="images/tea-icon.png" alt=""
        /></span>
        <span class="tab-item__text link-btn-text">Tea</span>
      </button>

      <button class="tab-item" type="button" data-category="dessert">
        <span class="tab-item__icon" aria-hidden="true"
          ><img class="tab-item__img" src="images/dessert-icon.png" alt=""
        /></span>
        <span class="tab-item__text link-btn-text">Dessert</span>
      </button>
    </div>
  </div>
</section>
